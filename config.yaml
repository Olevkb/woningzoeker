# Woningzoeker – jouw zoekcriteria (zie docs/eisen.md voor de uitleg)
# Pas dit bestand aan en de zoeker gebruikt het bij de volgende scan.

zoeken:
  plaats: Amsterdam

  # Maximale huur per aantal bewoners (= aantal slaapkamers). De €525 huurtoeslag is voor de hele woning.
  #   kaal    = kale huur, servicekosten komen erbij
  #   service = prijs inclusief servicekosten, zonder gas/water/licht
  #   alles   = prijs inclusief alles, ook gas/water/licht
  # Staat er niet bij wat voor prijs het is, dan geldt 'kaal' (de strengste).
  budget:
    2: {kaal: 2600, service: 2750, alles: 2925}  # 2 × €1.200 + €525
    3: {kaal: 3250, service: 3400, alles: 3525}  # 3 × €1.000 + €525
    4: {kaal: 4200, service: 4350, alles: 4525}  # 4 × €1.000 + €525

  # Minimaal 2 slaapkamers; staat alleen het aantal kamers erbij, dan minimaal 3 (woonkamer telt mee).
  min_slaapkamers: 2
  min_kamers: 3
  min_m2: 45

  # Gemeubileerde woningen: 'uitsluiten' of 'label' (dan wel melden, met 🛋).
  # Biedt de advertentie ook ongemeubileerd/gestoffeerd aan, dan wordt hij altijd gemeld, met label.
  gemeubileerd: uitsluiten

  # Wijken waar je wilt wonen. Dit zijn de officiële wijknamen (CBS/PDOK).
  # De zoeker zoekt per advertentie op in welke wijk het adres ligt.
  wijken:
    # --- Centrum ---
    - Haarlemmerbuurt
    - Jordaan
    - Grachtengordel-West
    - Grachtengordel-Zuid
    - Burgwallen-Nieuwe Zijde
    - Burgwallen-Oude Zijde
    - Nieuwmarkt/Lastage
    - De Weteringschans
    - Weesperbuurt/Plantage
    # --- De Pijp ---
    - Oude Pijp
    - Nieuwe Pijp
    - Zuid Pijp
    # --- Zuid ---
    - Museumkwartier
    - Willemspark
    - Schinkelbuurt
    - Hoofddorppleinbuurt
    - Stadionbuurt
    - Apollobuurt
    - Scheldebuurt
    - IJselbuurt
    - Rijnbuurt
    - Prinses Irenebuurt e.o.
    - Zuidas
    # --- Oost: strook tussen Amstel en Wibautstraat ---
    - Weesperzijde

  # Buurten binnen die wijken die er tóch niet bij horen (officiële buurtnamen, ook uit PDOK).
  buurten_uitsluiten:
    - Westerdokseiland        # Haarlemmerbuurt, overkant van het spoor
    - Westelijke eilanden     # Prinseneiland, Bickerseiland, Realeneiland
    - Planciusbuurt-Noord
    - Planciusbuurt-Zuid
    - Oosterdokseiland        # achter Centraal Station

huurtoeslag:
  per_maand: 525  # voor de hele woning; de melding deelt dit door het aantal bewoners

# Teksten in de advertentie. Elke regel is een zoekpatroon (hoofdletters maken niet uit).
# Alleen wat expliciet in de advertentie staat telt; staat er niets, dan valt hij niet af.
tekst:
  # Advertentie wordt OVERGESLAGEN als een van deze patronen erin staat.
  uitsluiten:
    # koopwoning: sommige makelaars zetten koop en huur door elkaar, en '€ 439.000' mag nooit als huur doorgaan
    - kosten koper
    - \bk\.k\.
    - vrij op naam
    - \bv\.o\.n\.
    - \bkoopprijs\b
    # studenten niet welkom, alleen werkenden, bedrijven of senioren
    - geen studenten\b
    - niet (geschikt )?(voor|aan) studenten
    - studenten (zijn |worden )?niet (welkom|toegestaan|geaccepteerd)
    - no students?\b
    - not (suitable |available )?for students
    - students? (will |are |is )?(not|never) (be )?(allowed|accepted|welcome|considered)
    - professionals only
    - only (for )?(young )?(working )?professionals
    - (looking for|seeking|searching for|suitable for|preferably|ideal for|intended for|bij voorkeur|op zoek naar|zoeken|gezocht) (an? |a young )?(young )?(working )?professionals?
    - alleen (voor )?werkenden
    - (geschikt|bedoeld) voor (een )?werkende
    - expats? only|only (for )?expats?
    - company let\b
    - bedrijfsverhuur
    - alleen via (de |je |uw )?werkgever
    - only (through|via) (an? |your )?employer
    - \b55\+
    - 55 jaar (of|en) ouder
    - seniorenwoning
    - senioren(complex|appartement)
    # niet geschikt voor 2 vrienden
    - \b1 persoon\b
    - \b1 person\b
    - (één|one|single) (persoon|person)\b
    - single occupancy
    - (alleen|uitsluitend) (geschikt )?voor (een )?(stel|koppel|echtpaar)
    - \b(couples?|stel) only
    - only (suitable )?for (a )?couples?
    - geen (woning)?delers
    - geen (woning)?delen\b
    - niet (geschikt )?(aan|voor) (woning)?delers
    - niet geschikt (om te delen|voor (woning)?delen)
    - (woning)?delen (is )?niet (toegestaan|mogelijk)
    - no (house ?)?sharers
    - not (suitable |available )?for (house ?)?shar(ing|ers)
    - no (house ?)?sharing
    - sharing (is )?not (allowed|permitted|possible)
    # geen huurtoeslag mogelijk: niet zelfstandig, niet inschrijven, geen echt huurcontract
    - onzelfstandig
    - gedeelde (keuken|badkamer|douche|toilet|sanitair)
    - \b(keuken|badkamer|toilet|douche|sanitair|huiskamer|woonkamer)\s*:?\s*gedeeld
    - huurtoeslag( mogelijk)?\s*:?\s*(niet mogelijk|nee)\b
    - shared (kitchen|bathroom|toilet)
    - anti-?kraak
    - leegstand(s)?beheer
    - bruikleen(overeenkomst|contract)
    - inschrijv\w* (is )?niet (mogelijk|toegestaan)
    - geen inschrijving
    - registration (is )?not (possible|allowed)
    - no registration
    - not possible to register
    # garantsteller expliciet uitgesloten
    - geen garantstellers?\b(?!\s+(nodig|vereist|noodzakelijk|verplicht))
    - garantstell\w* (is |zijn |wordt |worden )?niet (mogelijk|toegestaan|geaccepteerd)
    - \bno guarantors?\b(?!\s+(needed|required))
    - guarantors? (are |is )?not (accepted|allowed|possible)
    - eigen inkomen (is )?(vereist|verplicht|noodzakelijk)
    - own income (is )?required
    # short stay (korter dan 6 maanden)
    - short[- ]stay
    - kortdurend verblijf
    - (huurperiode|rental period|lease term|contractduur)\s*:?\s*(max(imaal|imum)?\.?\s*)?[1-5]\s*(maanden|months)\b

  # Inkomenseis: met garantsteller erbij → 🤝, zonder → grote waarschuwing bovenaan.
  inkomenseis:
    - '\b([2-5](?:[.,]\d)?) ?(?:x|×|keer|maal|times) (?:de |het |the )?(?:kale |bruto |gross |netto |monthly |maand)*(?:huur|rent|huurprijs|maandhuur|inkomen|income)'
    - inkomenseis
    - inkomensvoorwaarden|inkomensvereiste|inkomensnorm
    - income requirements?
    - (minimum|gross) (monthly |annual )?income of
    - (required|minimum) (gross )?(monthly |annual |yearly )?income
    - inkomen van (minimaal|ten minste|minstens)
  garantsteller:
    - garantste
    - garantiestel
    - borgsteller
    - guarant(or|ee)

  # Positieve punten: komen als label in de melding.
  pluspunten:
    studenten (zijn )?(welkom|toegestaan)|students? (are )?(welcome|allowed): "🎓 studenten welkom"
    jongerencontract|campuscontract|jongerenwoning|studentencontract: "🎓 jongeren-/campuscontract"
    (woning)?delers (welkom|toegestaan|mogelijk)|suitable for (house ?)?shar|sharers (welcome|allowed)|delen (is )?toegestaan: "👥 delers toegestaan"

  # Neutrale dingen die handig zijn om te weten.
  letop:
    tijdelijk|temporary|(?<!on)bepaalde tijd|fixed[- ]term|diplomatenclausule: "⏳ tijdelijk contract"

  # Waarschuwingen.
  rode_vlaggen:
    onderhuur|onderverhuur|\bsublet|sub-let: "🚩 onderhuur: check of de eigenaar toestemming geeft"

  # Signalen van mogelijke oplichting.
  oplichting:
    - western union
    - moneygram
    - (ik|we|i) (woon|wonen|live|am|are) (nu )?(in het )?(buitenland|abroad)
    - sleutels? (per|via de) post
    - keys? (by|via) (mail|post)
    - (betaal|pay) .{0,30}(voor|before) (de )?(bezichtiging|viewing)
    - airbnb (betaling|payment)

scan:
  # Hoe vaak de zoeker kijkt (in minuten), als hij lokaal met --loop draait. Op GitHub: elke 5 minuten.
  interval_minuten: 5
  nacht_interval_minuten: 20
  # 'makelaars' = alle bronnen uit makelaars.yaml. 'gmail' (de e-mailalerts) staat bewust als laatste:
  # dan zijn de makelaars al bekeken en kan een alert gekoppeld worden aan de advertentie van de makelaar.
  bronnen:
    - makelaars
    - rentola
    # - huurstunt   # sinds 2 nov een menscheck (Cloudflare): scripts niet meer welkom
    - kamernet
    - 123wonen
    - vesteda
    - vbt
    - gmail
  # Bij de allereerste scan alleen advertenties melden die niet ouder zijn dan dit.
  eerste_scan_max_uren: 48
  # Nooit meer dan dit aantal meldingen per scan (tegen een stortvloed).
  max_meldingen_per_scan: 15
  # Zelfde woning op een andere site binnen zoveel dagen = geen nieuwe melding.
  dubbel_dagen: 14

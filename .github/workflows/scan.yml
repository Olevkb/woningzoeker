name: Woningzoeker

on:
  schedule:
    - cron: "*/5 * * * *"  # elke 5 minuten (GitHub kan bij drukte een paar minuten later starten)
  workflow_dispatch:  # handmatig starten via het tabblad Actions
    inputs:
      modus:
        description: "Wat moet hij doen?"
        type: choice
        default: scan
        options:
          - scan            # normaal: scannen en melden
          - droog           # scannen, matches alleen in het logboek tonen
          - test-makelaars  # controleren of elke makelaar nog werkt

concurrency:
  group: woningzoeker
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # het geheugen (welke advertenties al gezien zijn) gaat van scan naar scan mee via de cache
      - name: Geheugen ophalen
        uses: actions/cache/restore@v4
        with:
          path: data
          key: geheugen-${{ github.run_id }}
          restore-keys: geheugen-

      - name: Scannen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_ADRES: ${{ secrets.GMAIL_ADRES }}
          GMAIL_APP_WACHTWOORD: ${{ secrets.GMAIL_APP_WACHTWOORD }}
          MODUS: ${{ inputs.modus || 'scan' }}
        run: |
          if [ "$MODUS" = "scan" ]; then python -m woningzoeker; else python -m woningzoeker --$MODUS; fi

      - name: Geheugen bewaren
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: geheugen-${{ github.run_id }}
